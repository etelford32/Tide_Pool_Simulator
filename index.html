<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A realistic tide pool ecosystem simulation with physics-based interactions">
    <title>Tide Pool Simulator v0.1.1</title>
    <!-- Build: 2026-01-05T14:25 WASM Fix -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1e3a5f 0%, #2d5a7b 50%, #1a1a2e 100%);
            overflow: hidden;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            min-width: 300px;
            z-index: 100;
        }

        #info-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        #info-panel .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        #info-panel .stat label {
            color: #aaa;
        }

        #info-panel .stat value {
            color: #fff;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        button {
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #45b7af;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .mode-btn {
            background: #555;
        }

        .mode-btn.active {
            background: #f39c12;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        #loading h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #4ecdc4;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Tide Pool...</h2>
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #aaa;">Initializing physics engine</p>
    </div>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>🌊 Tide Pool</h1>
        <div class="stat">
            <label>Time:</label>
            <value id="time">Day 0.0</value>
        </div>
        <div class="stat">
            <label>Tide Level:</label>
            <value id="tide">High</value>
        </div>
        <div class="stat">
            <label>Temperature:</label>
            <value id="temperature">15°C</value>
        </div>
        <div class="stat">
            <label>Species Count:</label>
            <value id="species">0</value>
        </div>
        <div class="stat">
            <label>Total Organisms:</label>
            <value id="organisms">0</value>
        </div>
        <div class="stat">
            <label>Biodiversity:</label>
            <value id="biodiversity">0.00</value>
        </div>
    </div>

    <div id="mode-toggle">
        <button id="game-mode" class="mode-btn active">Game Mode</button>
        <button id="sim-mode" class="mode-btn">Scientific Mode</button>
    </div>

    <div id="controls">
        <button id="play-pause">⏸ Pause</button>
        <button id="speed-up">⏩ Speed Up</button>
        <button id="slow-down">⏪ Slow Down</button>
        <button id="reset">🔄 Reset</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
