<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A realistic tide pool ecosystem simulation with physics-based interactions">
    <title>Tide Pool Simulator v0.1.1</title>
    <!-- Build: 2026-01-05T14:25 WASM Fix -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1e3a5f 0%, #2d5a7b 50%, #1a1a2e 100%);
            overflow: hidden;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            min-width: 300px;
            z-index: 100;
        }

        #info-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        #info-panel .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        #info-panel .stat label {
            color: #aaa;
        }

        #info-panel .stat value {
            color: #fff;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        button {
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #45b7af;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .mode-btn {
            background: #555;
        }

        .mode-btn.active {
            background: #f39c12;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        #loading h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #4ecdc4;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Camera Controls */
        #camera-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 100;
            min-width: 200px;
        }

        #camera-controls h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: #4ecdc4;
            text-align: center;
        }

        .camera-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .camera-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .camera-section-title {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .camera-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .camera-btn-group-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .camera-btn {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
            border: 1px solid rgba(78, 205, 196, 0.3);
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            font-weight: bold;
        }

        .camera-btn:hover {
            background: rgba(78, 205, 196, 0.4);
            border-color: #4ecdc4;
        }

        .camera-btn:active {
            transform: scale(0.95);
        }

        .camera-btn.text {
            font-size: 10px;
            font-weight: normal;
        }

        .camera-preset-btn {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.3);
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .camera-preset-btn:hover {
            background: rgba(243, 156, 18, 0.4);
            border-color: #f39c12;
        }

        .camera-preset-btn.active {
            background: rgba(243, 156, 18, 0.6);
            border-color: #f39c12;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zoom-slider {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }

        .zoom-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
        }

        .zoom-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
            border: none;
        }

        .camera-help {
            font-size: 9px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading Tide Pool...</h2>
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #aaa;">Initializing physics engine</p>
    </div>

    <div id="canvas-container"></div>

    <!-- Camera Controls -->
    <div id="camera-controls">
        <h3>📷 Camera</h3>

        <!-- Zoom -->
        <div class="camera-section">
            <div class="camera-section-title">Zoom</div>
            <div class="zoom-control">
                <button class="camera-btn" id="zoom-out">−</button>
                <input type="range" class="zoom-slider" id="zoom-slider" min="3" max="50" value="15" step="0.5">
                <button class="camera-btn" id="zoom-in">+</button>
            </div>
        </div>

        <!-- Pan -->
        <div class="camera-section">
            <div class="camera-section-title">Pan</div>
            <div class="camera-btn-group">
                <div></div>
                <button class="camera-btn" id="pan-up">↑</button>
                <div></div>
                <button class="camera-btn" id="pan-left">←</button>
                <button class="camera-btn text" id="pan-reset">⊙</button>
                <button class="camera-btn" id="pan-right">→</button>
                <div></div>
                <button class="camera-btn" id="pan-down">↓</button>
                <div></div>
            </div>
        </div>

        <!-- Rotate -->
        <div class="camera-section">
            <div class="camera-section-title">Rotate</div>
            <div class="camera-btn-group">
                <div></div>
                <button class="camera-btn" id="rotate-up">↻</button>
                <div></div>
                <button class="camera-btn" id="rotate-left">⟲</button>
                <button class="camera-btn text" id="rotate-reset">⊙</button>
                <button class="camera-btn" id="rotate-right">⟳</button>
                <div></div>
                <button class="camera-btn" id="rotate-down">↺</button>
                <div></div>
            </div>
        </div>

        <!-- Presets -->
        <div class="camera-section">
            <div class="camera-section-title">View Presets</div>
            <div class="camera-btn-group-2">
                <button class="camera-preset-btn" id="preset-default">Default</button>
                <button class="camera-preset-btn" id="preset-top">Top</button>
                <button class="camera-preset-btn" id="preset-side">Side</button>
                <button class="camera-preset-btn" id="preset-front">Front</button>
                <button class="camera-preset-btn" id="preset-isometric">Iso</button>
                <button class="camera-preset-btn" id="preset-follow">Follow 🐠</button>
            </div>
        </div>

        <!-- Help Text -->
        <div class="camera-help">
            <strong>Mouse:</strong> Left-drag=Orbit, Right-drag=Pan, Scroll=Zoom<br>
            <strong>Keys:</strong> WASD=Pan, QE=Rotate, ZX=Zoom, Space=Reset
        </div>
    </div>

    <div id="info-panel">
        <h1>🌊 Tide Pool</h1>
        <div class="stat">
            <label>Time:</label>
            <value id="time">Day 0.0</value>
        </div>
        <div class="stat">
            <label>Tide Level:</label>
            <value id="tide">High</value>
        </div>
        <div class="stat">
            <label>Temperature:</label>
            <value id="temperature">15°C</value>
        </div>
        <div class="stat">
            <label>Species Count:</label>
            <value id="species">0</value>
        </div>
        <div class="stat">
            <label>Total Organisms:</label>
            <value id="organisms">0</value>
        </div>
        <div class="stat">
            <label>Biodiversity:</label>
            <value id="biodiversity">0.00</value>
        </div>
    </div>

    <div id="mode-toggle">
        <button id="game-mode" class="mode-btn active">Game Mode</button>
        <button id="sim-mode" class="mode-btn">Scientific Mode</button>
    </div>

    <div id="controls">
        <button id="play-pause">⏸ Pause</button>
        <button id="speed-up">⏩ Speed Up</button>
        <button id="slow-down">⏪ Slow Down</button>
        <button id="reset">🔄 Reset</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
